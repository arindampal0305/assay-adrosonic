version: '3.8'

services:
  assay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assay_app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./samples:/app/samples
    env_file:
      - .env.example
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
